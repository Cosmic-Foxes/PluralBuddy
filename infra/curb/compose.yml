# The 'curb' is the extra resources that PluralBuddy could need, for autodeploying, etc.

name: pluralbuddy-curb
version: "3"
services:
  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage: {}