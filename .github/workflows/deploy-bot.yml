name: Deploy Bot

on:
  push:
    branches:
      - main
      - gh-deploying

permissions:
  packages: write

jobs:
  commit-hash:
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.get_commit.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v4
      - name: Get commit hash
        id: get_commit
        run: echo "::set-output name=commit_hash::$(git rev-parse HEAD)"
  build-and-push-image:
    needs: 
      - commit-hash
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: .
          push: true
          tags: |
            ghcr.io/giftedl/pluralbuddy/bot:latest
            ghcr.io/giftedl/pluralbuddy/bot:${{ needs.commit-hash.outputs.commit_hash }}
          build-args: GIT_COMMIT=${{ github.sha }} 
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DOCKER_SSH_KEY }}

      - name: Replace infra files & build compose
        id: vars
        run: |
          scp -r infra/* ${{ secrets.DOCKER_USER }}@${{ secrets.DOCKER_HOST }}:infra
          ssh ${{ secrets.DOCKER_USER }}@${{ secrets.DOCKER_HOST }} << 'EOF'
            cd infra
            docker compose pull bot
            docker compose up -d
            docker container stop pluralbuddy-bot
            docker container rm pluralbuddy-bot
            docker compose up -d --remove-orphans
          EOF